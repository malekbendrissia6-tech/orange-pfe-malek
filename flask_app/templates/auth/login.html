<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Orange Tunisie</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="login-page">

  <div class="login-container">

    <div class="login-logo">
      <div class="orange-logo">orange<sup>™</sup></div>
    </div>

    <h1 class="login-title">Connexion</h1>
    <p class="login-subtitle">Un seul portail pour accéder à votre espace</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert-msg alert-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.login') }}" class="login-form">

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email"
               placeholder="votre@orange.tn" required autofocus>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <div class="input-pwd">
          <input type="password" id="password" name="password"
                 placeholder="Votre mot de passe" required>
          <button type="button" class="toggle-pwd" onclick="togglePassword()">
            <i class="bi bi-eye" id="eye-icon"></i>
          </button>
        </div>
      </div>

      <div class="form-checkbox">
        <input type="checkbox" id="remember" name="remember">
        <label for="remember">Se souvenir de moi</label>
      </div>

      <button type="submit" class="btn-primary btn-full">Se connecter</button>

    </form>
  </div>

  <script>
    function togglePassword() {
      const pwd  = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
      } else {
        pwd.type = 'password';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
      }
    }
  </script>
</body>
</html>
