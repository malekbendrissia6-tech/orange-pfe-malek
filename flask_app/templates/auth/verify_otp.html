<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verification - Orange Tunisie</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
  <style>
    .otp-wrapper { display:flex; gap:10px; justify-content:center; margin:24px 0; }
    .otp-digit {
      width:52px; height:60px; font-size:26px; font-weight:700;
      text-align:center; border:2px solid #E0E0E0; border-radius:8px;
      transition:border-color 0.2s; outline:none;
    }
    .otp-digit:focus { border-color:#FF6600; box-shadow:0 0 0 3px rgba(255,102,0,.15); }
    .timer-badge {
      display:inline-block; background:#FFF5EE; color:#FF6600;
      padding:4px 12px; border-radius:20px; font-size:13px; font-weight:600;
    }
  </style>
</head>
<body class="login-page">

<div class="login-container" style="justify-content:center;">

  <div style="width:100%; max-width:460px; padding:24px;">

    <div class="text-center mb-4">
      <div class="orange-logo-box mx-auto mb-3">
        <span class="orange-logo-text">orange</span>
        <sup class="orange-logo-tm">&#x2122;</sup>
      </div>
      <h2 class="login-title">Verification email</h2>
      <p class="text-muted">Code envoye a <strong>{{ email }}</strong></p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} alert-dismissible fade show" role="alert">
          {{ msg }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.verify_otp') }}" onsubmit="buildOtp()">
      <input type="hidden" name="email" value="{{ email }}">
      <input type="hidden" name="otp" id="otp-hidden">

      <div class="otp-wrapper">
        <input type="text" maxlength="1" class="otp-digit" inputmode="numeric" pattern="[0-9]">
        <input type="text" maxlength="1" class="otp-digit" inputmode="numeric" pattern="[0-9]">
        <input type="text" maxlength="1" class="otp-digit" inputmode="numeric" pattern="[0-9]">
        <input type="text" maxlength="1" class="otp-digit" inputmode="numeric" pattern="[0-9]">
        <input type="text" maxlength="1" class="otp-digit" inputmode="numeric" pattern="[0-9]">
        <input type="text" maxlength="1" class="otp-digit" inputmode="numeric" pattern="[0-9]">
      </div>

      <div class="text-center mb-3">
        <span class="timer-badge">Expire dans <span id="timer">5:00</span></span>
      </div>

      <button type="submit" class="btn btn-orange btn-lg w-100 mb-3">
 Verifier le code
      </button>
    </form>

    <div class="text-center">
      <a href="{{ url_for('auth.resend_otp', email=email) }}" class="text-orange fw-bold">
        Renvoyer un nouveau code
      </a>
    </div>

    <div class="text-center mt-3">
      <a href="{{ url_for('auth.inscription') }}" class="text-muted small">
        Retour a l'inscription
      </a>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Auto-avance entre les cases
var digits = document.querySelectorAll('.otp-digit');
digits.forEach(function(input, idx) {
  input.addEventListener('input', function(e) {
    var val = e.target.value.replace(/\D/g, '');
    e.target.value = val;
    if (val && idx < digits.length - 1) digits[idx + 1].focus();
  });
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Backspace' && !e.target.value && idx > 0) digits[idx - 1].focus();
  });
  input.addEventListener('paste', function(e) {
    var text = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g,'');
    digits.forEach(function(d, i) { if (text[i]) d.value = text[i]; });
    e.preventDefault();
  });
});

function buildOtp() {
  var code = '';
  digits.forEach(function(d) { code += d.value; });
  document.getElementById('otp-hidden').value = code;
}

// Timer 5 minutes
var secs = 300;
var timerEl = document.getElementById('timer');
var iv = setInterval(function() {
  secs--;
  if (secs <= 0) { clearInterval(iv); timerEl.textContent = 'Expire'; return; }
  var m = Math.floor(secs / 60), s = secs % 60;
  timerEl.textContent = m + ':' + (s < 10 ? '0' : '') + s;
}, 1000);

// Focus sur le premier champ
if (digits[0]) digits[0].focus();
</script>
</body>
</html>
